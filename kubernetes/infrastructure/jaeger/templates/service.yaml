# Имя сервиса совпадает с тем, что указано в extensionProviders istiod:
# jaeger-collector.jaeger.svc.cluster.local:4317.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
spec:
  selector:
    app: jaeger
  ports:
    # Имя порта обязано начинаться с grpc-: Istio определяет протокол по
    # префиксу имени. С произвольным именем Envoy отправлял OTLP по HTTP/1.1,
    # и Jaeger отвечал "received bogus greeting from client".
    - name: grpc-otlp
      port: 4317
      targetPort: grpc-otlp
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
spec:
  selector:
    app: jaeger
  ports:
    - name: http
      port: 80
      targetPort: ui
