# Рекомендации Talos: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
cilium:
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  # KubePrism: локальный балансировщик Talos на каждом узле.
  k8sServiceHost: localhost
  k8sServicePort: 7445
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  operator:
    replicas: 1
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
