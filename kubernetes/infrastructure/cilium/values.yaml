# Рекомендации Talos: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
cilium:
  # Имя и идентификатор кластера. Межкластерную связность берёт на себя
  # Istio (east-west gateway), Cluster Mesh не используется, но имя удобно
  # видеть в hubble и в метриках. Переопределяется оверлеем кластера.
  cluster:
    name: east
    id: 1
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  # Прозрачное шифрование трафика между узлами: ключи WireGuard узлы
  # согласуют попарно, трафик идёт через интерфейс cilium_wg0.
  #
  # mTLS по идентичности рабочей нагрузки даёт Istio, а не Cilium: ztunnel
  # в Cilium 1.20 несовместим с межкластерной работой, а прежний
  # authentication.mutual на SPIRE удаляется в 1.21. WireGuard остаётся и
  # закрывает трафик вне меша: kubelet, DNS, поды без sidecar.
  encryption:
    enabled: true
    type: wireguard
    # Трафик самих узлов (не подов) не шифруем: он идёт внутри VPC.
    nodeEncryption: false
  # Совместимость с Istio (документация Cilium, раздел Integration with Istio).
  # При kubeProxyReplacement сокетная балансировка подменяет адрес назначения
  # ещё в connect(), и трафик уходит мимо прокси Istio. hostNamespaceOnly
  # оставляет её только в host netns; cni.exclusive нужно снять, чтобы
  # istio-cni мог дописать свою цепочку.
  socketLB:
    hostNamespaceOnly: true
  cni:
    exclusive: false
  # KubePrism: локальный балансировщик Talos на каждом узле.
  k8sServiceHost: localhost
  k8sServicePort: 7445
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  operator:
    replicas: 1
  # Сертификаты Hubble выпускает certgen внутри кластера (метод cronJob),
  # а не Helm: при методе helm CA пересоздаётся при каждом рендере чарта.
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
    tls:
      auto:
        method: cronJob
