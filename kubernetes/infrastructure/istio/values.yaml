# Istio в режиме ambient: ztunnel на каждом узле даёт mTLS между подами по
# идентичности SPIFFE, waypoint добавляется только там, где нужен L7.
#
# Межкластерная связность тоже на Istio, а не на Cluster Mesh Cilium:
# держать две системы для одной задачи смысла нет. Кластеры объявлены
# разными сетями, трафик между ними идёт через east-west gateway.
#
# Имя кластера, сеть и адреса шлюза задаёт оверлей кластера в
# kubernetes/clusters/<name>/values/istio.yaml.
#
# Адреса east-west gateway: приватные адреса worker-узлов. На них вешается
# сервис с externalIPs (templates/eastwest-address.yaml), а bootstrap/mesh.sh
# записывает их же в status сервиса шлюза. istiod берёт адрес шлюза из
# status.addresses объекта Gateway, куда он попадает из статуса сервиса;
# meshNetworks в режиме ambient не используется вовсе.
eastwestAddresses: []

ambient:
  global:
    meshID: mesh1
    variant: distroless
  istiod:
    profile: ambient
    meshConfig:
      # Куда waypoint отправляет спаны. Провайдер объявляется здесь, а
      # включается ресурсом Telemetry рядом с приложением: так трассировка
      # включается точечно, а не всему мешу сразу.
      extensionProviders:
        - name: otel
          opentelemetry:
            service: jaeger-collector.jaeger.svc.cluster.local
            port: 4317
    env:
      # Мультисетевой ambient: без этих флагов east-west gateway не
      # используется и удалённые endpoint'ы не появляются.
      AMBIENT_ENABLE_MULTI_NETWORK: "true"
      AMBIENT_ENABLE_BAGGAGE: "true"
    pilot:
      # Узлы стенда 2 ядра и 4 ГБ.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

  cni:
    profile: ambient
    cni:
      # Cilium остаётся основным CNI, istio-cni дописывает свою цепочку.
      chained: true

  ztunnel:
    profile: ambient
    resourceName: ztunnel
