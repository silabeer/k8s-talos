# Istio в режиме ambient: ztunnel на каждом узле даёт mTLS между подами по
# идентичности SPIFFE, waypoint добавляется только там, где нужен L7.
#
# Межкластерная связность тоже на Istio, а не на Cluster Mesh Cilium:
# держать две системы для одной задачи смысла нет. Кластеры объявлены
# разными сетями, трафик между ними идёт через east-west gateway.
#
# Имя кластера, сеть и meshID задаёт оверлей кластера в
# kubernetes/clusters/<name>/values/istio.yaml.
# Адреса east-west gateway этого кластера: приватные адреса worker-узлов,
# на них вешается сервис с externalIPs (см. templates/eastwest-address.yaml).
# Задаёт оверлей кластера.
eastwestAddresses: []

ambient:
  global:
    meshID: mesh1
    variant: distroless
    # Как добраться до шлюза каждой сети. Без этого istiod не знает адреса
    # соседнего кластера: сервис шлюза типа NodePort, внешнего адреса у него
    # нет, автоопределение работает только с LoadBalancer.
    # Список одинаков во всех кластерах меша.
    meshNetworks:
      network1:
        endpoints:
          - fromRegistry: east
        gateways:
          - address: 10.10.0.100
            port: 15008
          - address: 10.10.0.101
            port: 15008
      network2:
        endpoints:
          - fromRegistry: west
        gateways:
          - address: 10.20.0.100
            port: 15008
          - address: 10.20.0.101
            port: 15008

  istiod:
    profile: ambient
    env:
      # Мультисетевой ambient: без этих флагов east-west gateway не
      # используется и удалённые endpoint'ы не появляются.
      AMBIENT_ENABLE_MULTI_NETWORK: "true"
      AMBIENT_ENABLE_BAGGAGE: "true"
    pilot:
      # Узлы стенда 2 ядра и 4 ГБ.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

  cni:
    profile: ambient
    cni:
      # Cilium остаётся основным CNI, istio-cni дописывает свою цепочку.
      chained: true

  ztunnel:
    profile: ambient
    resourceName: ztunnel
