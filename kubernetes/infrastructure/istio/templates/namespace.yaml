# Метка сети на istio-system: по ней istiod понимает, в какой сети живут
# рабочие нагрузки кластера, и решает, идти напрямую или через east-west
# gateway. Argo CD создаёт namespace без меток, поэтому задаём его сами.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    topology.istio.io/network: {{ required "нужен .Values.network" .Values.network | quote }}
    # Talos включает Pod Security Admission с профилем baseline по умолчанию.
    # istio-cni и ztunnel работают с hostPath, NET_ADMIN и unconfined AppArmor,
    # под baseline они не стартуют вовсе: DaemonSet бесконечно повторяет
    # FailedCreate. Чарт эти метки не проставляет, задаём сами.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
