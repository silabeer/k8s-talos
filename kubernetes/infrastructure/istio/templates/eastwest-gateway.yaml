# East-west gateway: точка входа для трафика из других кластеров меша.
# Порт 15008, double HBONE, TLS терминируется в режиме ISTIO_MUTUAL.
#
# Тип сервиса NodePort, а не LoadBalancer: провайдера LoadBalancer в кластере
# нет, а узлы обоих кластеров живут в одной VPC и видят друг друга.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-eastwestgateway
  namespace: istio-system
  labels:
    topology.istio.io/network: {{ required "нужен .Values.network" .Values.network | quote }}
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio-east-west
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      tls:
        mode: Terminate
        options:
          gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
