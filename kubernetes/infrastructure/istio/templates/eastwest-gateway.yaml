# East-west gateway: точка входа для трафика из других кластеров меша.
# Порт 15008, double HBONE, TLS терминируется в режиме ISTIO_MUTUAL.
#
# Реально трафик приходит на <адрес worker-узла>:15008: это отдельный сервис
# с externalIPs, см. eastwest-address.yaml. Подсети кластеров в одной VPC.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-eastwestgateway
  namespace: istio-system
  labels:
    # Обязательна: istiod ищет сетевые шлюзы среди объектов Gateway и
    # пропускает те, у которых нет этой метки (remoteK8sGatewayToNetworkGateways
    # в pilot/pkg/serviceregistry/ambient/networks.go). Без неё в логах
    # "No network gateway found for network ..." и endpoint'ы соседнего
    # кластера до ztunnel не доходят.
    topology.istio.io/network: {{ required "нужен .Values.network" .Values.network | quote }}
  annotations:
    # LoadBalancer, хотя провайдера LoadBalancer в кластере нет. istiod
    # рекламирует соседям адрес из status сервиса, а его для LoadBalancer
    # никто не проставляет автоматически — это делает bootstrap/mesh.sh,
    # записывая туда приватные адреса worker-узлов. При NodePort istiod
    # рекламировал ClusterIP, недоступный из другого кластера.
    networking.istio.io/service-type: LoadBalancer
spec:
  gatewayClassName: istio-east-west
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      tls:
        mode: Terminate
        options:
          gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
