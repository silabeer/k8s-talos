argo-cd:
  global:
    domain: argocd.example.com
  configs:
    params:
      # TLS терминируется на Traefik.
      server.insecure: true
    cm:
      timeout.reconciliation: 60s
  server:
    # Вход через Gateway API: общий Gateway держит Traefik. В кластере без
    # Traefik оверлей выключает HTTPRoute (kubernetes/clusters/west).
    httproute:
      enabled: true
      parentRefs:
        # group и kind — значения по умолчанию, но их дописывает API-сервер,
        # и без них Argo CD считает ресурс изменившимся (OutOfSync навсегда).
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: web
      hostnames:
        - argocd.example.com
  # Корневое приложение (app-of-apps). Всё остальное разворачивается из kubernetes/bootstrap.
  extraObjects:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root
        namespace: argocd
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: https://github.com/silabeer/k8s-talos.git
          targetRevision: main
          path: kubernetes/clusters/east/bootstrap
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - ServerSideApply=true
