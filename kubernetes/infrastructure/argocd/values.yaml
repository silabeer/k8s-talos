argo-cd:
  global:
    domain: argocd.example.com
  configs:
    params:
      # TLS терминируется на Traefik.
      server.insecure: true
    cm:
      timeout.reconciliation: 60s
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls: true
  # Корневое приложение (app-of-apps). Всё остальное разворачивается из kubernetes/bootstrap.
  extraObjects:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root
        namespace: argocd
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: https://github.com/silabeer/k8s-talos.git
          targetRevision: main
          path: kubernetes/bootstrap
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - ServerSideApply=true
