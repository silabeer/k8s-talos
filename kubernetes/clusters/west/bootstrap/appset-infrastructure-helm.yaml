# Платформенные компоненты (helm) кластера west. Состав кластеров различается, поэтому список
# явный, а не генератор по файлам.
# Здесь только umbrella-чарты: kustomize-приложения не имеют Chart.yaml,
# и helm-параметры в шаблоне ломают им рендер.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: cilium
            namespace: kube-system
            path: kubernetes/infrastructure/cilium
          - name: argocd
            namespace: argocd
            path: kubernetes/infrastructure/argocd
          - name: istio
            namespace: istio-system
            path: kubernetes/infrastructure/istio
          - name: jaeger
            namespace: jaeger
            path: kubernetes/infrastructure/jaeger
          - name: metrics-server
            namespace: kube-system
            path: kubernetes/infrastructure/metrics-server
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/silabeer/k8s-talos.git
        targetRevision: main
        path: "{{ .path }}"
        helm:
          # Общие values компонента плюс оверлей этого кластера, если он есть.
          valueFiles:
            - values.yaml
            - ../../clusters/west/values/{{ .name }}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      # Часть полей webhook'ов дописывает не Argo CD: caBundle подставляет
      # istiod или cainjector, а failurePolicy istiod переключает после того,
      # как поднимется. Без этого приложение навсегда остаётся OutOfSync.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.failurePolicy
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
