# Компоненты кластера west перечислены явно: состав кластеров различается,
# а генератор по файлам создавал бы во всех одно и то же.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: gateway-api
            namespace: gateway-system
            path: kubernetes/infrastructure/gateway-api
          - name: cilium
            namespace: kube-system
            path: kubernetes/infrastructure/cilium
          - name: argocd
            namespace: argocd
            path: kubernetes/infrastructure/argocd
          - name: istio
            namespace: istio-system
            path: kubernetes/infrastructure/istio
          - name: metrics-server
            namespace: kube-system
            path: kubernetes/infrastructure/metrics-server
          - name: kubelet-serving-cert-approver
            namespace: kubelet-serving-cert-approver
            path: kubernetes/infrastructure/kubelet-serving-cert-approver
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/silabeer/k8s-talos.git
        targetRevision: main
        path: "{{ .path }}"
        helm:
          # Общие values компонента плюс необязательный оверлей этого кластера.
          valueFiles:
            - values.yaml
            - ../../clusters/west/values/{{ .name }}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
