# Компоненты кластера west перечислены явно: состав кластеров различается,
# а генератор по файлам создавал бы во всех одно и то же.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: mesh-demo
            namespace: mesh-demo
            path: kubernetes/apps/mesh-demo
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/silabeer/k8s-talos.git
        targetRevision: main
        path: "{{ .path }}"
        helm:
          # Общие values компонента плюс необязательный оверлей этого кластера.
          valueFiles:
            - values.yaml
            - ../../clusters/west/values/{{ .name }}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
