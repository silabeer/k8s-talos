# Оверлей кластера west поверх kubernetes/infrastructure/istio/values.yaml.
network: network2

# Приватные адреса worker-узлов этого кластера: на них вешается сервис
# с externalIPs, по которому шлюз доступен соседнему кластеру.
eastwestAddresses:
  - 10.20.0.100
  - 10.20.0.101

ambient:
  global:
    network: network2
    multiCluster:
      clusterName: west
  ztunnel:
    multiCluster:
      clusterName: west
