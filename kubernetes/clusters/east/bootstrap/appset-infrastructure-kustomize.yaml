# Платформенные компоненты (kustomize) кластера east. Состав кластеров различается, поэтому список
# явный, а не генератор по файлам.
# Здесь только kustomize: helm-параметры этим приложениям не нужны.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-kustomize
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: gateway-api
            namespace: gateway-system
            path: kubernetes/infrastructure/gateway-api
          - name: kubelet-serving-cert-approver
            namespace: kubelet-serving-cert-approver
            path: kubernetes/infrastructure/kubelet-serving-cert-approver
          - name: piraeus
            namespace: piraeus-datastore
            path: kubernetes/infrastructure/piraeus
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/silabeer/k8s-talos.git
        targetRevision: main
        path: "{{ .path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      # Часть полей webhook'ов дописывает не Argo CD: caBundle подставляет
      # istiod или cainjector, а failurePolicy istiod переключает после того,
      # как поднимется. Без этого приложение навсегда остаётся OutOfSync.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.failurePolicy
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
