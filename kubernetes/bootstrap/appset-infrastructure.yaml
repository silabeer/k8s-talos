# Каждая папка kubernetes/infrastructure/<name>/ с файлом app.yaml
# становится Application. Содержимое app.yaml: name, namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/silabeer/k8s-talos.git
        revision: main
        files:
          - path: kubernetes/infrastructure/*/app.yaml
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/silabeer/k8s-talos.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
