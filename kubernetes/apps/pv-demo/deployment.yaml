# Демонстрация постоянного тома: при каждом старте под дописывает строку в файл
# на томе и отдаёт этот файл по HTTP. История запусков переживает пересоздание
# пода и переезд на другой узел, значит данные действительно на PV.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-demo
  labels:
    app: pv-demo
spec:
  replicas: 1
  # Том ReadWriteOnce: старый под должен отцепиться раньше, чем поднимется новый.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pv-demo
  template:
    metadata:
      labels:
        app: pv-demo
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              echo "$(date -Iseconds)  старт на узле $NODE_NAME, под $HOSTNAME" >> /data/boots.log
              cp /data/boots.log /data/index.html
              exec httpd -f -p 8080 -h /data
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pv-demo
