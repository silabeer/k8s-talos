{{- if .Values.waypoint.enabled }}
# Маршрутизация по заголовку. Это возможно только благодаря waypoint:
# ztunnel работает на L4 и заголовков не видит.
#
# parentRef здесь — Service, а не Gateway. Для трафика внутри меша правило
# привязывается к сервису назначения, и клиенту ничего менять не нужно.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mesh-demo
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: mesh-demo
      port: 80
  rules:
    {{- range .Values.clusters }}
    # x-cluster: {{ . }} — принудительно в кластер {{ . }}. Из другого
    # кластера запрос уйдёт через east-west gateway.
    - matches:
        - headers:
            - type: Exact
              name: x-cluster
              value: {{ . | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: mesh-demo-{{ . }}
          port: 80
          weight: 1
    {{- end }}
    # Без заголовка — обычная балансировка, с предпочтением своего кластера.
    - backendRefs:
        - group: ""
          kind: Service
          name: mesh-demo
          port: 80
          weight: 1
{{- end }}
