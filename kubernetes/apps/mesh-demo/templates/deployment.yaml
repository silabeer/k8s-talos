# Сервер отвечает именем кластера и своего пода. Развёрнут в обоих кластерах
# под одним именем и в одном неймспейсе: именно так Istio делает сервис
# общим для меша и балансирует запросы между кластерами.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-demo
  labels:
    app: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-demo
  template:
    metadata:
      labels:
        app: mesh-demo
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /www
              echo "кластер ${CLUSTER}, под ${HOSTNAME}, узел ${NODE_NAME}" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: CLUSTER
              value: {{ .Values.cluster | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
