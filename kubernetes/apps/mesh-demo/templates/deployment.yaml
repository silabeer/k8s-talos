{{- if .Values.server }}
# Сервер отвечает именем своего кластера. Имя деплоймента включает кластер,
# чтобы сервис mesh-demo-<кластер> выбирал только его поды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-demo-{{ .Values.cluster }}
  labels:
    app: mesh-demo
    cluster: {{ .Values.cluster }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-demo
      cluster: {{ .Values.cluster }}
  template:
    metadata:
      labels:
        app: mesh-demo
        cluster: {{ .Values.cluster }}
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /www
              echo "кластер ${CLUSTER}, под ${HOSTNAME}, узел ${NODE_NAME}" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: CLUSTER
              value: {{ .Values.cluster | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
{{- end }}
