# Имя кластера подставляет оверлей kubernetes/clusters/<name>/values/mesh-demo.yaml.
cluster: unknown

# Все кластеры меша. Сервисы mesh-demo-<кластер> создаются в каждом кластере,
# а поды под них — только в своём: так на любой запрос можно адресовать
# конкретный кластер, и конфигурация остаётся одинаковой везде.
clusters:
  - east
  - west

# Разворачивать ли сервер в этом кластере. Service создаётся всегда: в Istio
# сервис должен существовать в каждом кластере, откуда к нему обращаются, но
# поды могут жить в другом.
server: true

# Waypoint: отдельный Envoy на неймспейс. ztunnel работает на L4 и в HTTP не
# заглядывает, поэтому маршрутизация по заголовкам, ретраи, таймауты и
# трассировка возможны только через waypoint.
waypoint:
  enabled: true
  # Имя обязано совпадать во всех кластерах меша: ambient-мультикластер
  # сопоставляет waypoint по имени.
  name: waypoint
